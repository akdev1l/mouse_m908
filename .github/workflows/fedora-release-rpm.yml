on:
  push:
    tags:
      - v*

jobs:
  fedora-release-rpm:
    runs-on: ubuntu-latest
    container: fedora:34
    steps:
      - uses: actions/checkout@v2
      - name: install tools and dependencies
        run: |
          dnf install -y rpm-build findutils clang-tools-extra 'dnf-command(builddep)'
          dnf builddep -y mouse_m908.spec
      - name: build mouse_m908 rpm package
        run: |
          make -j4 rpm
      - name: upload rpm package
        uses: actions/upload-artifact@v2
        with:
          name: mouse_m908-${{ env.GITHUB_RUN_ID }}
          path: mouse_m908-3.2-1.x86_64.rpm
      - name: create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./mouse_m908-3.2-1.x86_64.rpm
          asset_name: mouse_m908-3.2-1.x86_64.rpm
          asset_content_type: application/octet-stream
